services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: local-parking
    volumes:
      - parking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: local-parking
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${PARKING_PORT:-8080}:80"
    depends_on:
      - api
  smoke:
    profiles: [test]
    image: node:22-alpine
    environment:
      PARKING_URL: http://web
    volumes:
      - ./scripts:/scripts:ro
    command: ["node", "/scripts/smoke.mjs"]
    depends_on:
      - web
volumes:
  parking-data:
